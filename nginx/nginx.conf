upstream web {
    server web:5173;
}

server {
    listen 80;

    # All traffic proxied to the Vite dev server.
    # The API is intentionally NOT proxied here — it stays on port 3000 directly
    # so that Socket.IO WebSocket upgrades and namespace routing work without any
    # path rewriting tricks. VITE_API_URL points to HOST:3000 in all cases.
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # Vite HMR WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
