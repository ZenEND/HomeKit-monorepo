services:
  postgres:
    image: postgres:16-alpine
    container_name: homekit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homekit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homekit}
      POSTGRES_DB: ${POSTGRES_DB:-homekit}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-homekit} -d ${POSTGRES_DB:-homekit}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homekit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: homekit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      JWT_KEY: ${JWT_KEY:-change-me-in-production}
      JWT_EXPIRES: ${JWT_EXPIRES:-1d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@homekit.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-homekit}
      DB_PASSWORD: ${DB_PASSWORD:-homekit}
      DB_NAME: ${DB_NAME:-homekit}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://${HOST:-localhost}:5173
    ports:
      - '3000:3000'
    volumes:
      - ./packages/api:/app/packages/api
      - ./packages/engine:/app/packages/engine
      - ./packages/types:/app/packages/types
      - /app/node_modules
      - /app/packages/api/node_modules
    command: pnpm --filter api start:dev

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: homekit-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://${HOST:-localhost}:3000
    ports:
      - '5173:5173'
    volumes:
      - ./packages/web:/app/packages/web
      - ./packages/engine:/app/packages/engine
      - ./packages/types:/app/packages/types
      - /app/node_modules
      - /app/packages/web/node_modules
    command: pnpm --filter web dev --host

volumes:
  pgdata:
  redisdata:
