# Nginx overlay — serves the web frontend on port 80
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up --build
#
# Nginx routes:
#   http://HOST/     → web:5173  (Vite dev server + HMR WebSocket)
#
# The API stays on port 3000 directly. Socket.IO connects to HOST:3000 without
# any path rewriting, so namespaces and WebSocket upgrades work out of the box.
# CORS_ORIGIN is updated to accept requests from the nginx-served origin (port 80).

services:
  nginx:
    image: nginx:alpine
    container_name: homekit-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    environment:
      CORS_ORIGIN: http://${HOST:-localhost}
